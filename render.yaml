# Render one-click config: Docker runtime, free plan, health-checked.
services:
  - type: web
    name: screensmp
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Optional: base64 of a Netscape cookies.txt from a logged-in YouTube
      # session — only needed if YouTube bot-checks this IP hard. Leave unset.
      - key: YOUTUBE_COOKIES_B64
        sync: false
